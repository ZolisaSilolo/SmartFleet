name: SmartFleet CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least privilege by default; jobs that deploy add id-token: write for OIDC federation (no long-lived AWS keys).
permissions:
  contents: read

concurrency:
  group: smartfleet-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: af-south-1
  WAF_REGION: us-east-1   # CLOUDFRONT-scope WAF resources can only be created in us-east-1
  SAM_CLI_TELEMETRY: '0'
  SAM_CLI_VERSION: 1.170.0
  IAC_MCP_VERSION: 1.0.26

jobs:
  # ===========================================================================
  # 1. VERIFY: every gate runs on pull requests and on main
  # ===========================================================================
  backend:
    name: Backend (lint, tests, dependency audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r backend/requirements-dev.txt
      - name: Lint
        run: ruff check backend scripts
      - name: Tests (includes infrastructure regression tests and tenant-isolation tests)
        run: pytest --cov=backend/src --cov-report=term-missing --cov-fail-under=85
      - name: Audit pinned production dependencies (full transitive set, hash-verified lockfile)
        run: pip-audit -r backend/layer/requirements.txt --require-hashes --disable-pip

  infrastructure:
    name: Infrastructure (SAM validate, cfn-lint, cfn-guard)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - run: pip install "aws-sam-cli==${SAM_CLI_VERSION}" cfn-lint==1.58.0
      - name: Validate SAM template
        run: sam validate --lint -t infrastructure/template.yaml --region "$AWS_REGION"
        env:
          AWS_DEFAULT_REGION: af-south-1
      - name: Expand SAM -> CloudFormation (offline)
        run: python scripts/expand_sam.py infrastructure/template.yaml expanded.json
      - name: cfn-lint
        run: cfn-lint expanded.json infrastructure/waf-cloudfront.yaml --regions af-south-1 us-east-1
      - name: cfn-guard security rules (documented waivers only)
        run: uv run --with "awslabs.aws-iac-mcp-server==${IAC_MCP_VERSION}" python scripts/check_compliance.py expanded.json infrastructure/waf-cloudfront.yaml

  frontend:
    name: Frontend (types, tests, build, audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Build (placeholder Cognito ids - real ones are injected at deploy time)
        run: npm run build
        env:
          VITE_COGNITO_USER_POOL_ID: af-south-1_placeholder
          VITE_COGNITO_CLIENT_ID: placeholder
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=moderate

  # ===========================================================================
  # 2. STAGING: automatic on main
  # ===========================================================================
  deploy-staging:
    name: Deploy to staging
    needs: [backend, infrastructure, frontend]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      id-token: write
      contents: read
    env:
      STAGE: staging
      STACK: smart-fleet-backend-staging
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install "aws-sam-cli==${SAM_CLI_VERSION}"
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_STAGING }}
          aws-region: ${{ env.AWS_REGION }}
          role-duration-seconds: 3600

      - name: Deploy WAF web ACL (us-east-1)
        run: |
          aws cloudformation deploy --region "$WAF_REGION" --stack-name "smart-fleet-waf-${STAGE}" \
            --template-file infrastructure/waf-cloudfront.yaml --parameter-overrides "Stage=${STAGE}" --no-fail-on-empty-changeset
          ARN=$(aws cloudformation describe-stacks --region "$WAF_REGION" --stack-name "smart-fleet-waf-${STAGE}" \
            --query "Stacks[0].Outputs[?OutputKey=='WebAclArn'].OutputValue" --output text)
          echo "WEB_ACL_ARN=${ARN}" >> "$GITHUB_ENV"

      - name: Build (arm64 layer from the hash-locked requirements)
        run: sam build -t infrastructure/template.yaml

      - name: Deploy backend + edge
        run: |
          sam deploy --config-file infrastructure/samconfig.toml --config-env staging --no-confirm-changeset \
            --parameter-overrides "Stage=${STAGE} AlertEmail=${{ vars.ALERT_EMAIL }} WebAclArn=${WEB_ACL_ARN}"

      - name: Read stack outputs
        run: |
          out() { aws cloudformation describe-stacks --stack-name "$STACK" --query "Stacks[0].Outputs[?OutputKey=='$1'].OutputValue" --output text; }
          {
            echo "SITE_URL=$(out FrontendUrl)"; echo "API_URL=$(out ApiUrl)"; echo "WEB_BUCKET=$(out FrontendBucketName)"
            echo "DIST_ID=$(out DistributionId)"; echo "POOL_ID=$(out UserPoolId)"; echo "CLIENT_ID=$(out UserPoolClientId)"
          } >> "$GITHUB_ENV"

      - name: Build and publish the frontend
        working-directory: frontend
        env:
          VITE_COGNITO_USER_POOL_ID: ${{ env.POOL_ID }}
          VITE_COGNITO_CLIENT_ID: ${{ env.CLIENT_ID }}
        run: |
          npm ci
          npm run build
          aws s3 sync dist/ "s3://${WEB_BUCKET}" --delete --cache-control "public,max-age=31536000,immutable" --exclude index.html
          aws s3 cp dist/index.html "s3://${WEB_BUCKET}/index.html" --cache-control "no-cache"
          aws cloudfront create-invalidation --distribution-id "$DIST_ID" --paths "/index.html" "/" > /dev/null

      - name: Smoke test
        run: python scripts/smoke_test.py --site "$SITE_URL" --api "$API_URL"

  # ===========================================================================
  # 3. PRODUCTION: plan (change set, nothing executed) -> human approval -> execute -> smoke test
  # ===========================================================================
  plan-prod:
    name: Plan production change set
    needs: deploy-staging
    runs-on: ubuntu-latest
    environment: production-plan
    permissions:
      id-token: write
      contents: read
    env:
      STAGE: prod
      STACK: smart-fleet-backend-prod
    outputs:
      changeset: ${{ steps.plan.outputs.changeset }}
      has_changes: ${{ steps.plan.outputs.has_changes }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - run: pip install "aws-sam-cli==${SAM_CLI_VERSION}"
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_PROD_PLAN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Deploy WAF web ACL (us-east-1)
        run: |
          aws cloudformation deploy --region "$WAF_REGION" --stack-name "smart-fleet-waf-${STAGE}" \
            --template-file infrastructure/waf-cloudfront.yaml --parameter-overrides "Stage=${STAGE}" --no-fail-on-empty-changeset
          ARN=$(aws cloudformation describe-stacks --region "$WAF_REGION" --stack-name "smart-fleet-waf-${STAGE}" \
            --query "Stacks[0].Outputs[?OutputKey=='WebAclArn'].OutputValue" --output text)
          echo "WEB_ACL_ARN=${ARN}" >> "$GITHUB_ENV"
      - run: sam build -t infrastructure/template.yaml
      - name: Create change set (does not execute)
        id: plan
        run: |
          # Pending change sets from earlier, unapproved runs are stale by definition: remove them so they can never be executed.
          for CS in $(aws cloudformation list-change-sets --stack-name "$STACK" --query "Summaries[?Status=='CREATE_COMPLETE'].ChangeSetName" --output text 2>/dev/null); do
            aws cloudformation delete-change-set --stack-name "$STACK" --change-set-name "$CS"
          done
          PARAMS="Stage=${STAGE} AlertEmail=${{ vars.ALERT_EMAIL }} WebAclArn=${WEB_ACL_ARN}"
          if [ -n "${{ vars.DOMAIN_NAME }}" ] && [ -n "${{ vars.CERTIFICATE_ARN }}" ]; then
            PARAMS="$PARAMS DomainName=${{ vars.DOMAIN_NAME }} CertificateArn=${{ vars.CERTIFICATE_ARN }}"
          fi
          sam deploy --config-file infrastructure/samconfig.toml --config-env prod --no-confirm-changeset --no-execute-changeset \
            --parameter-overrides "$PARAMS"
          NAME=$(aws cloudformation list-change-sets --stack-name "$STACK" \
            --query "sort_by(Summaries[?Status=='CREATE_COMPLETE'], &CreationTime)[-1].ChangeSetName" --output text)
          if [ -z "$NAME" ] || [ "$NAME" = "None" ]; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "### No infrastructure changes to apply" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            echo "changeset=${NAME}" >> "$GITHUB_OUTPUT"
            {
              echo "### Production change set \`${NAME}\` - review before approving"
              echo '| Action | Resource | Type | Replacement |'
              echo '|---|---|---|---|'
              aws cloudformation describe-change-set --stack-name "$STACK" --change-set-name "$NAME" \
                --query "Changes[].ResourceChange.[Action,LogicalResourceId,ResourceType,Replacement]" --output text | awk -F'\t' '{print "| "$1" | "$2" | "$3" | "$4" |"}'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  deploy-prod:
    name: Deploy to production (approval required)
    needs: plan-prod
    runs-on: ubuntu-latest
    environment: production   # configure required reviewers on this environment
    permissions:
      id-token: write
      contents: read
    env:
      STAGE: prod
      STACK: smart-fleet-backend-prod
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_PROD }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Execute the approved change set
        if: needs.plan-prod.outputs.has_changes == 'true'
        run: |
          aws cloudformation execute-change-set --stack-name "$STACK" --change-set-name "${{ needs.plan-prod.outputs.changeset }}"
          # Canary traffic shifting + alarm-based automatic rollback are handled by CodeDeploy (see template Globals).
          for i in $(seq 1 90); do
            STATUS=$(aws cloudformation describe-stacks --stack-name "$STACK" --query "Stacks[0].StackStatus" --output text)
            echo "stack status: $STATUS"
            case "$STATUS" in
              CREATE_COMPLETE|UPDATE_COMPLETE) exit 0 ;;
              *ROLLBACK*|*FAILED*) echo "::error::Deployment failed or rolled back ($STATUS)"; exit 1 ;;
            esac
            sleep 20
          done
          echo "::error::Timed out waiting for the stack"; exit 1
      - name: Read stack outputs
        run: |
          out() { aws cloudformation describe-stacks --stack-name "$STACK" --query "Stacks[0].Outputs[?OutputKey=='$1'].OutputValue" --output text; }
          {
            echo "SITE_URL=$(out FrontendUrl)"; echo "API_URL=$(out ApiUrl)"; echo "WEB_BUCKET=$(out FrontendBucketName)"
            echo "DIST_ID=$(out DistributionId)"; echo "POOL_ID=$(out UserPoolId)"; echo "CLIENT_ID=$(out UserPoolClientId)"
          } >> "$GITHUB_ENV"
      - name: Build and publish the frontend
        working-directory: frontend
        env:
          VITE_COGNITO_USER_POOL_ID: ${{ env.POOL_ID }}
          VITE_COGNITO_CLIENT_ID: ${{ env.CLIENT_ID }}
        run: |
          npm ci
          npm run build
          aws s3 sync dist/ "s3://${WEB_BUCKET}" --delete --cache-control "public,max-age=31536000,immutable" --exclude index.html
          aws s3 cp dist/index.html "s3://${WEB_BUCKET}/index.html" --cache-control "no-cache"
          aws cloudfront create-invalidation --distribution-id "$DIST_ID" --paths "/index.html" "/" > /dev/null
      - name: Smoke test
        run: python scripts/smoke_test.py --site "$SITE_URL" --api "$API_URL"
