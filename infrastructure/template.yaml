  LambdaConcurrencyAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub smart-fleet-${Stage}-lambda-concurrency
      AlarmDescription: Account-wide Lambda concurrency is near the regional quota.
        Request a Service Quotas increase.
      Namespace: AWS/Lambda
      MetricName: ConcurrentExecutions
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 3
      DatapointsToAlarm: 2
      Threshold: !Ref ConcurrencyAlarmThreshold
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertTopic

  HttpApi5xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub smart-fleet-${Stage}-api-5xx
      AlarmDescription: HTTP API returned server errors.
      Namespace: AWS/ApiGateway
      MetricName: 5xx
      Dimensions:
        - Name: ApiId
          Value: !Ref FleetHttpApi
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertTopic
      OKActions:
        - !Ref AlertTopic

  HttpApiLatencyAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub smart-fleet-${Stage}-api-latency-p95
      AlarmDescription: p95 API latency above 3 s for 3 consecutive periods.
      Namespace: AWS/ApiGateway
      MetricName: Latency
      Dimensions:
        - Name: ApiId
          Value: !Ref FleetHttpApi
      ExtendedStatistic: p95
      Period: 300
      EvaluationPeriods: 3
      DatapointsToAlarm: 3
      Threshold: 3000
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertTopic

  DynamoWriteThrottleAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub smart-fleet-${Stage}-ddb-write-throttles
      AlarmDescription: DynamoDB write throttling on a fleet table.
      ComparisonOperator: GreaterThanOrEqualToThreshold
      Threshold: 1
      EvaluationPeriods: 1
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertTopic
      Metrics:
        - Id: total
          Expression: SUM(METRICS())
          Label: WriteThrottles
          ReturnData: true
        - Id: w1
          ReturnData: false
          MetricStat:
            Stat: Sum
            Period: 300
            Metric:
              Namespace: AWS/DynamoDB
              MetricName: WriteThrottleEvents
              Dimensions:
                - Name: TableName
                  Value: !Ref VehiclesTable
        - Id: w2
          ReturnData: false
          MetricStat:
            Stat: Sum
            Period: 300
            Metric:
              Namespace: AWS/DynamoDB
              MetricName: WriteThrottleEvents
              Dimensions:
                - Name: TableName
                  Value: !Ref DriversTable
        - Id: w3
          ReturnData: false
          MetricStat:
            Stat: Sum
            Period: 300
            Metric:
              Namespace: AWS/DynamoDB
              MetricName: WriteThrottleEvents
              Dimensions:
                - Name: TableName
                  Value: !Ref TripsTable
        - Id: w4
          ReturnData: false
          MetricStat:
            Stat: Sum
            Period: 300
            Metric:
              Namespace: AWS/DynamoDB
              MetricName: WriteThrottleEvents
              Dimensions:
                - Name: TableName
                  Value: !Ref FuelTable
        - Id: w5
          ReturnData: false
          MetricStat:
            Stat: Sum
            Period: 300
            Metric:
              Namespace: AWS/DynamoDB
              MetricName: WriteThrottleEvents
              Dimensions:
                - Name: TableName
                  Value: !Ref MaintenanceTable
        - Id: w6
          ReturnData: false
          MetricStat:
            Stat: Sum
            Period: 300
            Metric:
              Namespace: AWS/DynamoDB
              MetricName: WriteThrottleEvents
              Dimensions:
                - Name: TableName
                  Value: !Ref RateLimitTable

  DynamoReadThrottleAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub smart-fleet-${Stage}-ddb-read-throttles
      AlarmDescription: DynamoDB read throttling on a fleet table.
      ComparisonOperator: GreaterThanOrEqualToThreshold
      Threshold: 1
      EvaluationPeriods: 1
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertTopic
      Metrics:
        - Id: total
          Expression: SUM(METRICS())
          Label: ReadThrottles
          ReturnData: true
        - Id: r1
          ReturnData: false
          MetricStat:
            Stat: Sum
            Period: 300
            Metric:
              Namespace: AWS/DynamoDB
              MetricName: ReadThrottleEvents
              Dimensions:
                - Name: TableName
                  Value: !Ref VehiclesTable
        - Id: r2
          ReturnData: false
          MetricStat:
            Stat: Sum
            Period: 300
            Metric:
              Namespace: AWS/DynamoDB
              MetricName: ReadThrottleEvents
              Dimensions:
                - Name: TableName
                  Value: !Ref DriversTable
        - Id: r3
          ReturnData: false
          MetricStat:
            Stat: Sum
            Period: 300
            Metric:
              Namespace: AWS/DynamoDB
              MetricName: ReadThrottleEvents
              Dimensions:
                - Name: TableName
                  Value: !Ref TripsTable
        - Id: r4
          ReturnData: false
          MetricStat:
            Stat: Sum
            Period: 300
            Metric:
              Namespace: AWS/DynamoDB
              MetricName: ReadThrottleEvents
              Dimensions:
                - Name: TableName
                  Value: !Ref FuelTable
        - Id: r5
          ReturnData: false
          MetricStat:
            Stat: Sum
            Period: 300
            Metric:
              Namespace: AWS/DynamoDB
              MetricName: ReadThrottleEvents
              Dimensions:
                - Name: TableName
                  Value: !Ref MaintenanceTable

  StreamIteratorAgeAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub smart-fleet-${Stage}-stream-iterator-age
      AlarmDescription: The CDC worker is more than 5 minutes behind the DynamoDB streams.
      Namespace: AWS/Lambda
      MetricName: IteratorAge
      Dimensions:
        - Name: FunctionName
          Value: !Sub ${AWS::StackName}-processor
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 5
      DatapointsToAlarm: 3
      Threshold: 300000
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertTopic

  EventDLQAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub smart-fleet-${Stage}-failed-stream-records
      AlarmDescription: Stream records exhausted retries and landed in the failure
        queue - replay per docs/RUNBOOKS.md.
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt EventDLQ.QueueName
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertTopic
      OKActions:
        - !Ref AlertTopic

  AiFailuresAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub smart-fleet-${Stage}-ai-failures
      AlarmDescription: Repeated AI (Bedrock) failures.
      Namespace: SmartFleet
      MetricName: AiFailures
      Dimensions:
        - Name: service
          Value: smart-fleet
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertTopic

  UnhandledErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub smart-fleet-${Stage}-unhandled-errors
      AlarmDescription: Application code raised an unhandled exception.
      Namespace: SmartFleet
      MetricName: UnhandledErrors
      Dimensions:
        - Name: service
          Value: smart-fleet
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertTopic

  OperationsDashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Sub SmartFleet-${Stage}
      DashboardBody: !Sub |
        {"widgets":[
          {"type":"metric","x":0,"y":0,"width":12,"height":6,"properties":{"title":"API requests / 4xx / 5xx","region":"${AWS::Region}","stat":"Sum","period":300,"metrics":[["AWS/ApiGateway","Count","ApiId","${FleetHttpApi}"],[".","4xx",".","."],[".","5xx",".","."]]}},
          {"type":"metric","x":12,"y":0,"width":12,"height":6,"properties":{"title":"API latency p95 (ms)","region":"${AWS::Region}","stat":"p95","period":300,"metrics":[["AWS/ApiGateway","Latency","ApiId","${FleetHttpApi}"]]}},
          {"type":"metric","x":0,"y":6,"width":12,"height":6,"properties":{"title":"Lambda errors by function","region":"${AWS::Region}","stat":"Sum","period":300,"metrics":[["AWS/Lambda","Errors","FunctionName","${AWS::StackName}-vehicles"],["...","${AWS::StackName}-trips"],["...","${AWS::StackName}-fuel"],["...","${AWS::StackName}-maintenance"],["...","${AWS::StackName}-analytics"],["...","${AWS::StackName}-ai"],["...","${AWS::StackName}-processor"]]}},
          {"type":"metric","x":12,"y":6,"width":12,"height":6,"properties":{"title":"CDC lag (IteratorAge ms) and failed records","region":"${AWS::Region}","period":60,"metrics":[["AWS/Lambda","IteratorAge","FunctionName","${AWS::StackName}-processor",{"stat":"Maximum"}],["AWS/SQS","ApproximateNumberOfMessagesVisible","QueueName","${EventDLQ.QueueName}",{"stat":"Maximum","yAxis":"right"}]]}},
          {"type":"metric","x":0,"y":12,"width":12,"height":6,"properties":{"title":"Business metrics","region":"${AWS::Region}","stat":"Sum","period":3600,"metrics":[["SmartFleet","TripsStarted","service","smart-fleet"],[".","TripsCompleted",".","."],[".","FuelAnomalies",".","."],[".","FuelOffGeofence",".","."],[".","AgentMaintenanceProposals",".","."]]}},
          {"type":"metric","x":12,"y":12,"width":12,"height":6,"properties":{"title":"AI usage and failures","region":"${AWS::Region}","stat":"Sum","period":300,"metrics":[["SmartFleet","AiRequests","service","smart-fleet"],[".","AiFailures",".","."]]}}
        ]}

Outputs:
  ApiUrl:
    Description: Direct HTTP API URL (smoke tests / local dev proxy). Browsers use
      the CloudFront /api path.
    Value: !Sub https://${FleetHttpApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}
  FrontendUrl:
    Description: Public URL of the application (CloudFront)
    Value: !Sub https://${FrontendDistribution.DomainName}
  FrontendBucketName:
    Value: !Ref FrontendBucket
  DistributionId:
    Value: !Ref FrontendDistribution
  UserPoolId:
    Value: !Ref UserPool
  UserPoolClientId:
    Value: !Ref UserPoolClient
  EventBusName:
    Value: !Ref FleetEventBus
  AlertTopicArn:
    Value: !Ref AlertTopic
  FailedRecordsQueueUrl:
    Value: !Ref EventDLQ